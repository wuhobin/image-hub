# 安装到宿主机 Nginx 的 conf.d/；替换域名，公网使用时配置 HTTPS。
server {
    listen 80;
    server_name imagehub.example.com;
    root /opt/image-hub/frontend/current;
    client_max_body_size 11m;

    # 不带 URI 后缀，保留原始 /api 路径及查询参数。
    location ~ ^/api(?:/|$) {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 只有已声明的页面回退到首页，未知路径、API 和文档不回退。
    location ~ ^/admin(?:/(?:login|users|settings|models|creations|templates))?/?$ {
        rewrite ^ /index.html last;
    }

    location ~ ^/(|login|register|history|profile|upload|create|creations|explore|templates|share/[0-9a-fA-F-]{36})/?$ {
        rewrite ^ /index.html last;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 不公开构建清单等隐藏文件。
    location ~ /\. {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
