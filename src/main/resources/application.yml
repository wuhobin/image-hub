spring:
  config:
    # 相对路径基于进程工作目录；ENV_FILE 可指定其他位置。
    import: "optional:file:${ENV_FILE:./.env}[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: image-hub
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  web:
    resources:
      # 前端由 Nginx 独立托管；默认不暴露依赖 JAR 的文档页面。
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: false
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:image-hub}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectTimeout=3000&socketTimeout=10000}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      pool-name: MyHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      #password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      client-type: lettuce
      lettuce:
        pool:
          # 最大活跃链接数 默认8
          max-active: 8
          # 最大空闲连接数 默认8
          max-idle: 8
          # 最小空闲连接数 默认0
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      # One file per request; leave room for multipart boundaries at the 10 MB limit.
      max-request-size: 11MB

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

platform:
  redis:
    two-level-cache:
      enabled: true
      instances:
        - name: imageHubSettings
          max-size: 16
          default-ttl: 3d
        - name: imageHubModels
          max-size: 1
          default-ttl: 3d
  security:
    enabled: true
    token-name: Authorization
    timeout: 259200
    active-timeout: -1
    token-style: uuid
    is-log: true
    exclude-paths:
      - /api/admin/auth/login
      - /api/health
      - /api/app/auth/login
      - /api/app/auth/register
      - /api/app/auth/email-code
  verification:
    key-prefix: image-hub:verification
    mail:
      # 配置 SMTP 后开启；当前工程尚未实现数据库邮件开关。
      enabled: ${MAIL_VERIFICATION_ENABLED:false}
      from: ${MAIL_USERNAME:}
      from-name: ${MAIL_FROM_NAME:Image Hub}
      code-length: 6
      expire-time: 5m
      cooldown: 60s
    sms:
      enabled: false
    image:
      enabled: false
  oss:
    upload-validation:
      max-size: 10MB
      allowed-content-types:
        - image/jpeg
        - image/png
        - image/webp
        - image/gif

dromara:
  x-file-storage:
    default-platform: qiniu-kodo-1
    qiniu-kodo:
      - platform: qiniu-kodo-1
        enable-storage: true
        access-key: ${QINIU_ACCESS_KEY}
        secret-key: ${QINIU_SECRET_KEY}
        bucket-name: ${QINIU_BUCKET_NAME}
        domain: ${QINIU_DOMAIN}
        base-path: ${QINIU_BASE_PATH:ImgHub/}

# 平台邮件实现会输出验证码，隐藏该业务包的敏感日志。
image-hub:
  ai:
    encryption-key: ${AI_MODEL_ENCRYPTION_KEY:}
    # 模型连接超时（1–60 秒），与响应等待时间分别配置。
    connect-timeout-seconds: 30
    timeout-seconds: 300
    # 仅限制 AI 图片，支持 B/KB/MB，最大 50MB；修改后重启，普通上传仍为 10MB。
    max-image-size: 10MB
    concurrency: 2
    worker-enabled: ${AI_WORKER_ENABLED:true}

logging:
  level:
    "org.springframework.ai": "OFF"
    "com.aurora.starter.verification.mail": "OFF"
    # The platform Sa-Token logger writes token values at INFO regardless of is-log.
    "com.aurora.starter.security.log": "WARN"

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Consume a rejected multipart body so clients can receive the 413 JSON response.
    max-swallow-size: 12MB
  shutdown: graceful

# 未指定环境时同样关闭文档；dev profile 显式开启。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false
  production: true
