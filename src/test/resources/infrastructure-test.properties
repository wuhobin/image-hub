# 测试不加载数据库；Redis 使用 Mock 连接，不访问外部服务。
# 测试仅导入随测试提供的配置，避免读取开发者的真实 .env。
spring.config.import=optional:classpath:/infrastructure-test.properties
spring.profiles.active=default
MAIL_USERNAME=test@example.test
MAIL_PASSWORD=test-mail-password
spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure,\
  com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
platform.verification.mail.enabled=false
platform.verification.sms.enabled=false
platform.verification.image.enabled=false
platform.redis.two-level-cache.enabled=false
# 只验证七牛云平台装配，不访问云端；这里均为虚构测试参数。
QINIU_ACCESS_KEY=test-qiniu-access-key
QINIU_SECRET_KEY=test-qiniu-secret-key
QINIU_BUCKET_NAME=image-hub-test
QINIU_DOMAIN=https://cdn.example.test/
QINIU_BASE_PATH=images/
